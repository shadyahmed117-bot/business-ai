<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b3f"><title>Business AI</title>
<style>
:root{--n:#102b3f;--t:#0e9f91;--bg:#f3f6f8;--ink:#172b3a;--muted:#6d7d89;--line:#e5ebef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{background:var(--n);color:white;padding:20px 14px}.brand{font-size:19px;font-weight:800;padding:10px}.brand small{display:block;font-size:11px;color:#b9cbd4;font-weight:400;margin-top:5px}.nav{display:grid;gap:5px;margin-top:20px}.nav button{border:0;background:none;color:#d5e1e7;text-align:right;padding:12px;border-radius:9px;font-size:14px}.nav button.active,.nav button:hover{background:#21465e;color:white}main{min-width:0}.top{height:65px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.top b{font-size:17px}.pill{background:#e9f7f5;color:#087e73;border-radius:30px;padding:7px 11px;font-size:12px}.content{padding:24px;max-width:1200px;margin:auto}.welcome{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.welcome h2{margin:0 0 6px;font-size:23px}.muted{color:var(--muted);font-size:13px}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:700}.primary{background:var(--t);color:white}.soft{background:#eaf0f3;color:var(--n)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:16px}.card label{color:var(--muted);font-size:12px}.value{font-size:22px;font-weight:800;margin:9px 0;direction:ltr;text-align:right}.panel{margin-top:14px}.panel h3{margin:0 0 14px;font-size:16px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:white}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:right;padding:12px;border-bottom:1px solid var(--line);font-size:13px}th{background:#f8fafb;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{margin-top:15px;padding:12px;border-radius:10px;background:#fff8e8;color:#76531a;font-size:12px;line-height:1.7}.modal{position:fixed;inset:0;background:#071b2bcc;display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.dialog{background:white;border-radius:15px;padding:18px;width:min(480px,100%)}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--muted)}input{padding:11px;border:1px solid #dbe4e9;border-radius:8px;width:100%;font:inherit}.mobile{display:none}
@media(max-width:800px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:5;top:0;bottom:0;right:-250px;width:230px;transition:right .2s}.side.open{right:0}.mobile{display:inline-block}.content{padding:16px 12px}.grid{grid-template-columns:repeat(2,1fr)}.welcome{align-items:flex-start;flex-direction:column}.top{padding:0 12px}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="brand">BUSINESS AI<small>One Platform. Every Business.</small></div><nav class="nav" id="nav"><button class="active" data-p="dashboard">▦ لوحة المعلومات</button><button data-p="companies">▣ الشركات</button><button data-p="sales">↗ المبيعات والفواتير</button><button data-p="expenses">↘ المصروفات</button><button data-p="inventory">▤ المخزون</button><button data-p="employees">♙ الموظفون</button><button data-p="reports">▥ التقارير</button><button data-p="assistant">✧ مساعد الأعمال</button><button data-p="settings">⚙ الإعدادات</button></nav></aside><main><header class="top"><div><button class="btn soft mobile" id="menu">☰</button> <b id="title">لوحة المعلومات</b></div><span class="pill">نسخة تجريبية</span></header><div class="content" id="view"></div></main></div>
<div class="modal" id="modal"><div class="dialog"><h3 id="mt">إضافة سجل</h3><form id="form"></form><button class="btn soft" onclick="closeModal()">إغلاق</button></div></div>
<script>
const names={dashboard:'لوحة المعلومات',companies:'الشركات',sales:'المبيعات والفواتير',expenses:'المصروفات',inventory:'المخزون',employees:'الموظفون',reports:'التقارير',assistant:'مساعد الأعمال',settings:'الإعدادات'};
const seed={companies:[{name:'شركة الشوربجي للتجارة',country:'السودان',kind:'تجارة وصناعة',status:'نشطة'}],sales:[{number:'INV-001',customer:'شركة الأمل',date:'2026-11-15',amount:1250000}],expenses:[{desc:'نقل وشحن',category:'تشغيل',date:'2026-11-15',amount:180000}],inventory:[{name:'لفات زنك',sku:'ZN-001',qty:120,unit:'طن'},{name:'حديد خام',sku:'IR-002',qty:85,unit:'طن'}],employees:[{name:'أحمد محمد',job:'مدير إنتاج',salary:450000}]};
let db;try{db=JSON.parse(localStorage.getItem('bai'))||seed}catch(e){db=seed}const save=()=>localStorage.setItem('bai',JSON.stringify(db));const money=n=>new Intl.NumberFormat('en-US').format(+n||0)+' ج.س';const sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);let page='dashboard';
const view=document.getElementById('view');
function dashboard(){let s=sum(db.sales,'amount'),e=sum(db.expenses,'amount');return `<div class="welcome"><div><h2>مرحباً بك في Business AI 👋</h2><div class="muted">نظرة عامة على أعمالك — بيانات تجريبية</div></div><button class="btn primary" onclick="add('sales')">＋ فاتورة جديدة</button></div><div class="grid"><div class="card"><label>إجمالي المبيعات</label><div class="value">${money(s)}</div></div><div class="card"><label>إجمالي المصروفات</label><div class="value">${money(e)}</div></div><div class="card"><label>الفرق المالي</label><div class="value">${money(s-e)}</div></div><div class="card"><label>الشركات المسجلة محلياً</label><div class="value">${db.companies.length}</div></div></div><div class="panel"><h3>النشاط الأخير</h3><p>عدد الفواتير: ${db.sales.length} — عدد المصروفات: ${db.expenses.length} — أصناف المخزون: ${db.inventory.length}</p></div><div class="notice">هذه نسخة تجريبية محلية. الأرقام ليست حسابات محاسبية معتمدة ولا تدخل بيانات حقيقية قبل ربط قاعدة بيانات آمنة.</div>`}
const cfg={companies:{label:'شركة',fields:[['name','اسم الشركة'],['country','الدولة'],['kind','النشاط']] ,cols:[['name','اسم الشركة'],['country','الدولة'],['kind','النشاط'],['status','الحالة']]},sales:{label:'فاتورة',fields:[['number','رقم الفاتورة'],['customer','العميل'],['date','التاريخ','date'],['amount','المبلغ','number']],cols:[['number','رقم الفاتورة'],['customer','العميل'],['date','التاريخ'],['amount','المبلغ','money']]},expenses:{label:'مصروف',fields:[['desc','الوصف'],['category','التصنيف'],['date','التاريخ','date'],['amount','المبلغ','number']],cols:[['desc','الوصف'],['category','التصنيف'],['date','التاريخ'],['amount','المبلغ','money']]},inventory:{label:'صنف',fields:[['name','اسم الصنف'],['sku','رمز الصنف'],['qty','الكمية','number'],['unit','الوحدة']],cols:[['name','الصنف'],['sku','الرمز'],['qty','الكمية'],['unit','الوحدة']]},employees:{label:'موظف',fields:[['name','الاسم'],['job','الوظيفة'],['salary','الراتب','number']],cols:[['name','الاسم'],['job','الوظيفة'],['salary','الراتب','money']]}};
function table(k){let c=cfg[k];return `<div class="welcome"><h2>${names[k]}</h2><button class="btn primary" onclick="add('${k}')">＋ إضافة ${c.label}</button></div><div class="tablewrap"><table><thead><tr>${c.cols.map(x=>`<th>${x[1]}</th>`).join('')}<th>إجراء</th></tr></thead><tbody>${db[k].map((r,i)=>`<tr>${c.cols.map(x=>`<td>${x[2]==='money'?money(r[x[0]]):(r[x[0]]??'—')}</td>`).join('')}<td><button class="btn soft" onclick="del('${k}',${i})">حذف</button></td></tr>`).join('')||`<tr><td colspan="${c.cols.length+1}">لا توجد بيانات</td></tr>`}</tbody></table></div>`}
function render(){document.getElementById('title').textContent=names[page];document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===page));if(page==='dashboard')view.innerHTML=dashboard();else if(cfg[page])view.innerHTML=table(page);else if(page==='reports')view.innerHTML=`<h2>التقارير</h2><div class="panel">الشركات: ${db.companies.length} | الفواتير: ${db.sales.length} | المصروفات: ${db.expenses.length} | الموظفون: ${db.employees.length}</div><div class="notice">التقارير أولية وتعتمد على بيانات العرض المحلية.</div>`;else if(page==='assistant')view.innerHTML=`<h2>مساعد الأعمال</h2><div class="panel"><p>مساعد تجريبي مبسط، غير متصل بمحرك ذكاء اصطناعي.</p><button class="btn primary" onclick="alert('إجمالي المبيعات: '+money(sum(db.sales,'amount'))+' — المصروفات: '+money(sum(db.expenses,'amount')))">اعرض الملخص المالي</button></div>`;else view.innerHTML=`<h2>الإعدادات</h2><div class="panel">اسم المنصة: Business AI<br>العملة الافتراضية: SDG<br>اللغة: العربية</div><div class="notice">هذه نسخة محلية غير متصلة بتسجيل دخول أو قاعدة بيانات سحابية.</div>`}
document.getElementById('nav').onclick=e=>{let b=e.target.closest('[data-p]');if(!b)return;page=b.dataset.p;render();document.getElementById('side').classList.remove('open')};document.getElementById('menu').onclick=()=>document.getElementById('side').classList.toggle('open');
function add(k){let c=cfg[k];document.getElementById('mt').textContent='إضافة '+c.label;let f=document.getElementById('form');f.innerHTML=c.fields.map(x=>`<div class="field"><label>${x[1]}</label><input name="${x[0]}" type="${x[2]||'text'}" required></div>`).join('')+'<button class="btn primary" type="submit">حفظ</button>';f.onsubmit=e=>{e.preventDefault();let o={};new FormData(f).forEach((v,k)=>o[k]=['amount','qty','salary'].includes(k)?+v:v);if(k==='companies')o.status='نشطة';db[k].push(o);save();closeModal();render()};document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}function del(k,i){if(confirm('تأكيد الحذف؟')){db[k].splice(i,1);save();render()}}render();
</script></body></html>
